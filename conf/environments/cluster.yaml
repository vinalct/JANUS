# The cloud-agnostic profile: an atomic Postgres-backed Iceberg catalog and a warehouse on
# object storage, reached through S3FileIO. Nothing here is MinIO-specific — pointing the
# same keys at real S3 and a managed Postgres is a change of values, never of code (NFR-1).
#
# Bring the stack up with `make up-cluster`, run against it with `make run-cluster`.
name: cluster

runtime:
  log_level: ${JANUS_LOG_LEVEL:-INFO}

spark:
  app_name: ${JANUS_SPARK_APP_NAME:-janus-cluster}
  master: ${JANUS_SPARK_MASTER:-local[*]}
  warehouse_dir: ${JANUS_SPARK_WAREHOUSE_DIR:-data/metadata/spark-warehouse}
  ivy_dir: ${JANUS_SPARK_IVY_DIR:-data/metadata/ivy}
  iceberg:
    catalog_name: ${JANUS_ICEBERG_CATALOG_NAME:-janus}
    catalog_type: ${JANUS_ICEBERG_CATALOG_TYPE:-jdbc}
    warehouse_dir: ${JANUS_ICEBERG_WAREHOUSE_DIR:-s3://janus-bronze/warehouse}
    runtime_package: ${JANUS_ICEBERG_RUNTIME_PACKAGE:-org.apache.iceberg:iceberg-spark-runtime-4.0_2.13:1.10.1}
    default_namespace: ${JANUS_ICEBERG_DEFAULT_NAMESPACE:-bronze}
    uri: ${JANUS_ICEBERG_CATALOG_URI:-jdbc:postgresql://postgres:5432/iceberg}
    driver_package: ${JANUS_ICEBERG_JDBC_DRIVER_PACKAGE:-org.postgresql:postgresql:42.7.13}
    credentials:
      user: ${JANUS_ICEBERG_CATALOG_USER:-}
      password: ${JANUS_ICEBERG_CATALOG_PASSWORD:-}
    object_store:
      io_impl: S3FileIO
      io_package: ${JANUS_ICEBERG_OBJECT_STORE_PACKAGE:-org.apache.iceberg:iceberg-aws-bundle:1.10.1}
      endpoint: ${JANUS_S3_ENDPOINT:-http://minio:9000}
      path_style_access: "${JANUS_S3_PATH_STYLE_ACCESS:-true}"
      region: ${JANUS_S3_REGION:-us-east-1}
  config:
    spark.driver.bindAddress: ${JANUS_SPARK_DRIVER_BIND_ADDRESS:-127.0.0.1}
    spark.driver.host: ${JANUS_SPARK_DRIVER_HOST:-127.0.0.1}
    spark.dynamicAllocation.enabled: "false"
    spark.sql.session.timeZone: UTC
    spark.sql.shuffle.partitions: ${JANUS_SPARK_SHUFFLE_PARTITIONS:-200}
    spark.ui.enabled: "false"

storage:
  root_dir: ${JANUS_DATA_ROOT:-data}
  raw_dir: ${JANUS_RAW_DIR:-data/raw}
  bronze_dir: ${JANUS_BRONZE_DIR:-data/bronze}
  metadata_dir: ${JANUS_METADATA_DIR:-data/metadata}
