source_id: full_refresh_history_partitioned
name: Full-refresh history partitioned fixture
owner: janus
enabled: true
source_type: api
strategy: api
strategy_variant: page_number_api
federation_level: federal
domain: test
public_access: true

access:
  base_url: https://example.invalid
  path: /records
  method: GET
  format: json
  timeout_seconds: 30
  auth:
    type: none
  pagination:
    type: page_number
    page_param: page
    size_param: page_size
    page_size: 10
  rate_limit:
    requests_per_minute: 10
    concurrency: 1

extraction:
  mode: full_refresh
  retry:
    max_attempts: 3
    backoff_strategy: fixed
    backoff_seconds: 1

schema:
  mode: infer

spark:
  input_format: json
  write_mode: overwrite
  repartition: 1
  partition_by:
    - partition_key

outputs:
  raw:
    path: data/raw/test/full_refresh_history_partitioned
    format: json
  bronze:
    path: data/bronze/test/full_refresh_history_partitioned
    format: iceberg
    namespace: bronze_full_refresh_history
    table_name: partitioned_fixture
  metadata:
    path: data/metadata/test/full_refresh_history_partitioned
    format: json

quality:
  required_fields:
    - id
  allow_schema_evolution: true
