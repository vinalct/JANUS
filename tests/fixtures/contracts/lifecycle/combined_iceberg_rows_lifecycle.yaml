apiVersion: v3.2.0
kind: DataContract
id: test.lifecycle.combined
name: Lifecycle combined source
version: 1.0.0
status: active
domain: test
description:
  purpose: The records envelope the combined request-input lifecycle suite pages through.
team:
  - username: janus-tests
    role: owner
schema:
  - name: bronze.example__lazy_spark_combined_source
    physicalType: table
    properties:
      - name: records
        logicalType: array
        physicalType: array
        items:
          name: element
          logicalType: object
          physicalType: struct
          properties:
          - name: id
            logicalType: string
            physicalType: string
          - name: window
            logicalType: string
            physicalType: string
customProperties:
  - property: janus.compatibility
    value: additive
  - property: janus.enforcement
    value: lenient
