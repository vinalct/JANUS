apiVersion: v3.2.0
kind: DataContract
id: test.hostile.base_v2
name: hostile fixture base_v2
version: 2.0.0
status: active
domain: test
description:
  purpose: 'base_dropped under a MAJOR bump: a declared breaking change a full refresh may apply with
    REPLACE TABLE.'
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: amount
    logicalType: integer
    physicalType: long
  - name: when
    logicalType: date
    physicalType: timestamptz
customProperties:
- property: janus.compatibility
  value: additive
- property: janus.enforcement
  value: strict
