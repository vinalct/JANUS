apiVersion: v3.2.0
kind: DataContract
id: test.hostile.base_max3
name: hostile fixture base_max3
version: 1.0.0
status: active
domain: test
description:
  purpose: 'base with janus.maxMalformedRows 3: a strict batch with up to three malformed rows still writes.'
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: label
    logicalType: string
    physicalType: string
  - name: amount
    logicalType: integer
    physicalType: long
  - name: when
    logicalType: date
    physicalType: timestamptz
customProperties:
- property: janus.compatibility
  value: additive
- property: janus.enforcement
  value: strict
- property: janus.maxMalformedRows
  value: '3'
