apiVersion: v3.2.0
kind: DataContract
id: test.hostile.base
name: hostile fixture base
version: 1.0.0
status: active
domain: test
description:
  purpose: 'The shape every other hostile contract is diffed against: id string required primaryKey, label
    string, amount long, when timestamptz; additive, strict.'
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: label
    logicalType: string
    physicalType: string
  - name: amount
    logicalType: integer
    physicalType: long
  - name: when
    logicalType: date
    physicalType: timestamptz
customProperties:
- property: janus.compatibility
  value: additive
- property: janus.enforcement
  value: strict
