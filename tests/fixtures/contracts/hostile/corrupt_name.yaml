apiVersion: v3.2.0
kind: DataContract
id: test.hostile.corrupt_name
name: hostile fixture corrupt_name
version: 1.0.0
status: active
domain: test
description:
  purpose: base plus a property named _janus_corrupt_record, the column the reader reserves for malformed
    records; the loader and the check refuse it.
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: label
    logicalType: string
    physicalType: string
  - name: amount
    logicalType: integer
    physicalType: long
  - name: when
    logicalType: date
    physicalType: timestamptz
  - name: _janus_corrupt_record
    logicalType: string
    physicalType: string
customProperties:
- property: janus.compatibility
  value: additive
- property: janus.enforcement
  value: strict
