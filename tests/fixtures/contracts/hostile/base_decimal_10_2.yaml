apiVersion: v3.2.0
kind: DataContract
id: test.hostile.base_decimal_10_2
name: hostile fixture base_decimal_10_2
version: 1.0.0
status: active
domain: test
description:
  purpose: 'base with amount decimal(10,2): the live shape of a precision widening.'
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: label
    logicalType: string
    physicalType: string
  - name: amount
    logicalType: number
    physicalType: decimal(10,2)
  - name: when
    logicalType: date
    physicalType: timestamptz
customProperties:
- property: janus.compatibility
  value: additive
- property: janus.enforcement
  value: strict
