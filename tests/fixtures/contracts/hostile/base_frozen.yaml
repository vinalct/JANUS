apiVersion: v3.2.0
kind: DataContract
id: test.hostile.base_frozen
name: hostile fixture base_frozen
version: 1.0.0
status: active
domain: test
description:
  purpose: 'base with compatibility frozen: every in-place difference is refused.'
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: label
    logicalType: string
    physicalType: string
  - name: amount
    logicalType: integer
    physicalType: long
  - name: when
    logicalType: date
    physicalType: timestamptz
customProperties:
- property: janus.compatibility
  value: frozen
- property: janus.enforcement
  value: strict
