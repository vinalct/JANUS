apiVersion: v3.2.0
kind: DataContract
id: test.hostile.base_reordered
name: hostile fixture base_reordered
version: 1.1.0
status: active
domain: test
description:
  purpose: 'base with the same four properties declared in the order amount, id, when, label (a MINOR
    change: appends resolve by name, AC-3).'
team:
- username: janus-tests
  role: owner
schema:
- name: hostile_base
  physicalType: table
  properties:
  - name: amount
    logicalType: integer
    physicalType: long
  - name: id
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
  - name: when
    logicalType: date
    physicalType: timestamptz
  - name: label
    logicalType: string
    physicalType: string
customProperties:
- property: janus.compatibility
  value: additive
- property: janus.enforcement
  value: strict
