
source_id: semantics_unregistered_variant
name: Semantics unregistered_variant
owner: janus-tests
enabled: false
source_type: api
strategy: api
strategy_variant: not_a_registered_variant
federation_level: federal
domain: semantics_rules
public_access: true
tags: [semantics]

access:
  base_url: https://example.invalid
  path: /records
  method: GET
  format: json
  timeout_seconds: 5
  auth:
    type: none
  pagination:
    type: page_number
    page_param: page
    size_param: page_size
