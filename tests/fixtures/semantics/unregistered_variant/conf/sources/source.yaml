extraction:
  mode: full_refresh
  retry:
    max_attempts: 1
    backoff_strategy: fixed
    backoff_seconds: 1

schema:
  contract: conf/contracts/semantics/unregistered_variant.yaml

spark:
  input_format: json
  write_mode: overwrite
  partition_by: [ingestion_date]

outputs:
  raw:
    path: data/raw/semantics/unregistered_variant
    format: json
  bronze:
    path: data/bronze/semantics/unregistered_variant
