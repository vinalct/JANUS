
source_id: semantics_rule_c_consumer
name: Semantics rule (c) consumer
owner: janus-tests
enabled: false
source_type: api
strategy: api
strategy_variant: page_number_api
federation_level: federal
domain: semantics_rules
public_access: true
tags: [semantics, rule_c, consumer]

access:
  base_url: https://example.invalid
  path: /details
  method: GET
  format: json
  timeout_seconds: 5
  auth:
    type: none
  pagination:
    type: page_number
    page_param: page
    size_param: page_size
    page_size: 100
  request_inputs:
    type: iceberg_rows
    upstream_source_id: semantics_rule_c_producer
    namespace: semantics
    table_name: rule_c_producer
    columns:
      code: code
      missing_binding: column_that_is_not_there
    distinct: true
  parameter_bindings:
    code:
      from: request_input.code
  rate_limit:
    concurrency: 1

extraction:
  mode: full_refresh
  retry:
    max_attempts: 1
    backoff_strategy: fixed
    backoff_seconds: 1

schema:
  contract: conf/contracts/semantics/rule_c_consumer.yaml

spark:
  input_format: json
  write_mode: overwrite
  partition_by: [ingestion_date]

outputs:
  raw:
    path: data/raw/semantics/rule_c_consumer
    format: json
  bronze:
    path: data/bronze/semantics/rule_c_consumer
    format: iceberg
    namespace: semantics
    table_name: rule_c_consumer
  metadata:
    path: data/metadata/semantics/rule_c_consumer
    format: json

quality: {}
