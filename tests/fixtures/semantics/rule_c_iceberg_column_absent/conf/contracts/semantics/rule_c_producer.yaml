apiVersion: v3.2.0
kind: DataContract
id: semantics.rule_c_producer
name: Semantics rule_c_producer
version: 1.0.0
status: active
domain: semantics_rules
description:
  purpose: Declares exactly code and label; the consumer reads a third column.
tags: [semantics]
team:
  - username: janus-tests
    role: owner
schema:
  - name: semantics.rule_c_producer
    physicalType: table
    properties:
      - name: code
        logicalType: string
        physicalType: string
        required: true
        primaryKey: true
      - name: label
        logicalType: string
        physicalType: string
customProperties:
  - property: janus.compatibility
    value: additive
  - property: janus.enforcement
    value: lenient
