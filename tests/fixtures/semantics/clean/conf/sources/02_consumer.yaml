
source_id: semantics_clean_consumer
name: Semantics clean consumer
owner: janus-tests
enabled: false
source_type: api
strategy: api
strategy_variant: page_number_api
federation_level: federal
domain: semantics_reporting
public_access: true
tags: [semantics, consumer]
source_hook: ibge.sidra_flat

access:
  base_url: https://example.invalid
  path: /details
  method: GET
  format: json
  timeout_seconds: 5
  auth:
    type: none
  pagination:
    type: page_number
    page_param: page
    size_param: page_size
    page_size: 100
  request_inputs:
    type: iceberg_rows
    upstream_source_id: semantics_clean_producer
    namespace: semantics
    table_name: clean_producer
    columns:
      code: code
      label: payload.label
    distinct: true
  parameter_bindings:
    code:
      from: request_input.code
  rate_limit:
    concurrency: 1

extraction:
  mode: full_refresh
  checkpoint_strategy: none
  retry:
    max_attempts: 1
    backoff_strategy: fixed
    backoff_seconds: 1

schema:
  contract: conf/contracts/semantics/clean_consumer.yaml

spark:
  input_format: json
  write_mode: overwrite
  repartition: 1
  partition_by: [ingestion_date, region]

outputs:
  raw:
    path: data/raw/semantics/clean_consumer
    format: json
  bronze:
    path: data/bronze/semantics/clean_consumer
    format: iceberg
    namespace: semantics
    table_name: clean_consumer
  metadata:
    path: data/metadata/semantics/clean_consumer
    format: json

quality:
  required_fields: [detail_id, code]
  unique_fields: [detail_id]
