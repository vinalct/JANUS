
source_id: semantics_multi_alpha
name: Semantics multi-issue alpha
owner: janus-tests
enabled: false
source_type: api
strategy: api
strategy_variant: page_number_api
federation_level: federal
domain: semantics_rules
public_access: true
tags: [semantics, multi_issue]

access:
  base_url: https://example.invalid
  path: /alpha
  method: GET
  format: json
  timeout_seconds: 5
  auth:
    type: none
  pagination:
    type: page_number
    page_param: page
    size_param: page_size
    page_size: 100
  rate_limit:
    concurrency: 1

extraction:
  mode: full_refresh
  retry:
    max_attempts: 1
    backoff_strategy: fixed
    backoff_seconds: 1

schema:
  contract: conf/contracts/semantics/multi_alpha.yaml

spark:
  input_format: json
  write_mode: overwrite
  partition_by: [ingestion_date, not_a_column]

outputs:
  raw:
    path: data/raw/semantics/multi_alpha
    format: json
  bronze:
    path: data/bronze/semantics/multi_alpha
    format: iceberg
    namespace: semantics
    table_name: multi_alpha
  metadata:
    path: data/metadata/semantics/multi_alpha
    format: json

quality: {}
