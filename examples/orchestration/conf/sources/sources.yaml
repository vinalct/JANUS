sources:
  - source_id: A
    name: Example reference producer A
    description: Writes the reference rows consumed by B.
    owner: janus-example
    enabled: true
    source_type: api
    strategy: api
    strategy_variant: page_number_api
    federation_level: federal
    domain: reference
    public_access: true
    tags: [example, reference, producer]
    access:
      base_url: http://127.0.0.1:8765
      path: /reference
      method: GET
      format: json
      timeout_seconds: 5
      auth:
        type: none
      pagination:
        type: page_number
        page_param: page
        size_param: page_size
        page_size: 100
      rate_limit:
        concurrency: 1
        backoff_seconds: 1
    extraction:
      mode: full_refresh
      checkpoint_strategy: none
      retry:
        max_attempts: 1
        backoff_strategy: fixed
        backoff_seconds: 1
    schema:
      contract: conf/contracts/reference/A.yaml
    spark:
      input_format: json
      write_mode: overwrite
      repartition: 1
      partition_by: [ingestion_date]
    outputs:
      raw:
        path: data/raw/A
        format: json
      bronze:
        path: data/bronze/A
        format: iceberg
        namespace: orchestration_example
        table_name: reference_a
      metadata:
        path: data/metadata/A
        format: json
    quality:
      required_fields: [reference_id, label]
      unique_fields: [reference_id]

  - source_id: B
    name: Example dependent consumer B
    description: Projects A.reference_id into one fixture request per reference row.
    owner: janus-example
    enabled: true
    source_type: api
    strategy: api
    strategy_variant: page_number_api
    federation_level: federal
    domain: reporting
    public_access: true
    tags: [example, consumer]
    access:
      base_url: http://127.0.0.1:8765
      path: /details
      method: GET
      format: json
      timeout_seconds: 5
      request_inputs:
        type: iceberg_rows
        upstream_source_id: A
        namespace: orchestration_example
        table_name: reference_a
        columns:
          reference_id: reference_id
        distinct: true
      parameter_bindings:
        reference_id:
          from: request_input.reference_id
      auth:
        type: none
      pagination:
        type: page_number
        page_param: page
        size_param: page_size
        page_size: 100
      rate_limit:
        concurrency: 1
        backoff_seconds: 1
    extraction:
      mode: full_refresh
      checkpoint_strategy: none
      retry:
        max_attempts: 1
        backoff_strategy: fixed
        backoff_seconds: 1
    schema:
      contract: conf/contracts/reporting/B.yaml
    spark:
      input_format: json
      write_mode: overwrite
      repartition: 1
      partition_by: [ingestion_date]
    outputs:
      raw:
        path: data/raw/B
        format: json
      bronze:
        path: data/bronze/B
        format: iceberg
        namespace: orchestration_example
        table_name: details_b
      metadata:
        path: data/metadata/B
        format: json
    quality:
      required_fields: [detail_id, reference_id, amount]
      unique_fields: [detail_id]

  - source_id: C
    name: Example independent source C
    description: Runs independently and demonstrates explicit date-window backfills.
    owner: janus-example
    enabled: true
    source_type: api
    strategy: api
    strategy_variant: page_number_api
    federation_level: federal
    domain: independent
    public_access: true
    tags: [example, independent]
    access:
      base_url: http://127.0.0.1:8765
      path: /independent
      method: GET
      format: json
      timeout_seconds: 5
      request_inputs:
        type: date_window
        start: 2026-09-01
        end: 2026-09-01
        step: day
      parameter_bindings:
        window_start:
          from: request_input.window_start
          format: "%Y-%m-%d"
        window_end:
          from: request_input.window_end
          format: "%Y-%m-%d"
      auth:
        type: none
      pagination:
        type: page_number
        page_param: page
        size_param: page_size
        page_size: 100
      rate_limit:
        concurrency: 1
        backoff_seconds: 1
    extraction:
      mode: full_refresh
      checkpoint_strategy: none
      retry:
        max_attempts: 1
        backoff_strategy: fixed
        backoff_seconds: 1
    schema:
      contract: conf/contracts/independent/C.yaml
    spark:
      input_format: json
      write_mode: overwrite
      repartition: 1
      partition_by: [ingestion_date]
    outputs:
      raw:
        path: data/raw/C
        format: json
      bronze:
        path: data/bronze/C
        format: iceberg
        namespace: orchestration_example
        table_name: independent_c
      metadata:
        path: data/metadata/C
        format: json
    quality:
      required_fields: [event_id, window_start, window_end]
      unique_fields: [event_id]
