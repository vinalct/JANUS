name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:            

jobs:
  fast:
    name: Fast gate (lint + unit)
    runs-on: ubuntu-latest       
    timeout-minutes: 10          
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13.12"
          cache: pip                          
          cache-dependency-path: requirements.txt   
      - name: Install engine-free lint/test tooling (no JVM or data engines)
        run: |
          python -m pip install --upgrade pip
          # Deliberately omit both runtime engines: the fast suites must remain import-free.
          python -m pip install \
            ruff==0.11.6 \
            mypy==2.2.0 \
            pytest==9.0.3 \
            'jsonschema[format]==4.25.1' \
            PyYAML==6.0.3 \
            certifi==2026.2.25
          python -m pip install --no-deps .
      - name: Audit pinned dependencies for known vulnerabilities
        run: |
          python -m pip install "pip-audit==2.10.1"
          audit_ignores="$(python -m tests.support.pip_audit_ignores .github/pip-audit-ignore.txt)"
          python -m pip_audit -r requirements.txt --strict --desc on \
            ${audit_ignores}
      - name: Installed-package smoke without Dagster or data engines
        run: |
          python -I -c "import importlib.util; assert all(importlib.util.find_spec(name) is None for name in ('dagster', 'pyspark', 'pyiceberg', 'pyarrow'))"
          python -I -c "import sys, janus, janus.main; assert not any(name == 'dagster' or name.startswith('dagster.') for name in sys.modules)"
          python -I -m janus.main --help >/dev/null
      - name: Validate every checked-in data contract against the pinned ODCS schema
        run: make test-contract-schema PYTHON=python
      - name: Assert required jobs configure no HTTP lineage destination
        run: python -m pytest -q tests/unit/observability/test_architecture_guardrails.py::test_required_ci_jobs_do_not_configure_http_openlineage
      - name: Lint (ruff, pinned 0.11.6)
        run: |
          ruff --version
          if ! ruff --version | grep -qx 'ruff 0\.11\.6'; then
            echo "::error::ruff version drift — expected 0.11.6 (source of truth: pyproject.toml [project.optional-dependencies].dev)"
            exit 1
          fi
          ruff check src tests
      - name: Type check
        run: mypy
      - name: Fast tests without adapter or active Spark
        run: make test-fast PYTHON=python

  adapter:
    name: Dagster gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the pinned Dagster optional extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dagster]' pytest==9.0.3
      - name: Adapter definitions, execution, retries, collection, and example loading
        run: make test-adapter PYTHON=python

  spark:
    name: Spark gate (full suite in container)
    runs-on: ubuntu-latest          
    timeout-minutes: 30             
    env:
      IVY_JAR: org.apache.iceberg_iceberg-spark-runtime-4.0_2.13-1.10.1.jar
      IVY_JAR_SHA256: 2192a0881ed0f5773b5a83a8820d2b0b2069beec203028643a1c338551007f09
      # The SQLite JDBC driver the default (jdbc) catalog opens its catalog database with.
      # Same offline rule as the Iceberg runtime: committed under deps/, seeded, sha256-verified,
      # proven visible in-container — never resolved from Maven at test time.
      SQLITE_JAR: org.xerial_sqlite-jdbc-3.53.2.1.jar
      SQLITE_JAR_SHA256: f55e405ed96d5ffe629e05b7b51b059e1c7d64527c0cc90a972fbac06730ccc1
      POSTGRES_JAR: org.postgresql_postgresql-42.7.13.jar
      POSTGRES_JAR_SHA256: 6e0e4cc2d8cae902084f8a2b18728b073a6fd9d1f87c9d8bff8f298c18185b93
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build JANUS image (buildx GHA layer cache)   
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .                       
          file: docker/Dockerfile
          tags: janus:local                 
          load: true                        
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Seed Spark jars from committed deps/ (no Maven at test time)
        run: |
          set -euo pipefail
          mkdir -p data/metadata/ivy/jars data/metadata/iceberg-catalog
          cp "deps/${IVY_JAR}" "data/metadata/ivy/jars/${IVY_JAR}"
          cp "deps/${SQLITE_JAR}" "data/metadata/ivy/jars/${SQLITE_JAR}"
          cp "deps/${POSTGRES_JAR}" "data/metadata/ivy/jars/${POSTGRES_JAR}"
      - name: Verify seeded jars are present and valid
        run: |
          set -euo pipefail
          for entry in "${IVY_JAR}:${IVY_JAR_SHA256}" "${SQLITE_JAR}:${SQLITE_JAR_SHA256}" "${POSTGRES_JAR}:${POSTGRES_JAR_SHA256}"; do
            jar="data/metadata/ivy/jars/${entry%:*}"
            test -s "$jar"
            echo "${entry##*:}  ${jar}" | sha256sum -c -   
            unzip -tq "$jar" >/dev/null                    
          done
      - name: Prove every seeded jar is visible in-container at test time (no Maven fetch)
        run: |
          set -euo pipefail
          docker compose -f docker/docker-compose.yml run --rm -T janus \
            sh -lc "ls -1 data/metadata/ivy/jars/${IVY_JAR} data/metadata/ivy/jars/${SQLITE_JAR} data/metadata/ivy/jars/${POSTGRES_JAR}"
      - name: Container runs non-root, /etc/passwd is not world-writable, unknown uid resolves
        run: |
          docker compose -f docker/docker-compose.yml run --rm -T janus sh -lc 'test "$(id -u)" != 0 && test "$(stat -c %a /etc/passwd)" = 644 && whoami'
          JANUS_CONTAINER_USER=4242:4242 docker compose -f docker/docker-compose.yml run --rm -T janus sh -lc 'whoami && python -c "import os,pwd; print(pwd.getpwuid(os.getuid()).pw_name)"'
      - name: Type check with PySpark installed
        run: |
          docker compose -f docker/docker-compose.yml run --rm -T janus \
            python -m mypy
      - name: Full test suite + coverage incl. integration (inside container)
        run: |
          set -o pipefail
          JANUS_CONTAINER_USER="$(id -u):$(id -g)" \
          docker compose -f docker/docker-compose.yml run --rm -T \
            -e COVERAGE_FILE=data/.coverage \
            janus \
            python -m pytest -ra -m 'not cluster' tests \
              --cov=janus \
              --cov-report=term-missing \
              --cov-report=xml:data/coverage.xml \
              --junitxml=data/metadata/test-reports/ci.xml \
            | tee data/pytest-output.txt
      - name: Prove both runtime engines are importable in the image
        run: |
          docker compose -f docker/docker-compose.yml run --rm -T janus \
            python -c "from importlib.metadata import version; import pyarrow, pyiceberg, pyspark.sql; assert version('pyiceberg') == '0.12.0'; print('pyspark', pyspark.__version__, 'pyiceberg', version('pyiceberg'), 'pyarrow', version('pyarrow'))"
      - name: Assert zero PySpark skips
        run: |
          if grep -Eiq "could not import .?pyspark(\.sql)?.?" data/pytest-output.txt; then
            echo "::error::AC-3 violated — Spark tests were SKIPPED for missing PySpark in the container job."
            echo "Offending skip lines:"
            grep -Ein "could not import .?pyspark" data/pytest-output.txt || true
            exit 1
          fi
          echo "OK: no PySpark import skips detected."
      - name: Assert the Iceberg writer path actually ran
        run: |
          if grep -Eiq "Iceberg runtime jar is not available" data/pytest-output.txt; then
            echo "::error::AC-3 violated — Iceberg writer/integration tests were SKIPPED for a missing runtime jar."
            echo "Offending skip lines:"
            grep -Ein "Iceberg runtime jar is not available" data/pytest-output.txt || true
            exit 1
          fi
          echo "OK: Iceberg runtime jar was present; writer path executed."
      - name: Assert the JDBC catalog differential actually ran
        run: |
          if grep -Eiq "SQLite JDBC driver jar is not available" data/pytest-output.txt; then
            echo "::error::order-13 AC-4 unproven — the hadoop-vs-jdbc bronze differential was SKIPPED for a missing driver jar."
            echo "Offending skip lines:"
            grep -Ein "SQLite JDBC driver jar is not available" data/pytest-output.txt || true
            exit 1
          fi
          echo "OK: SQLite JDBC driver jar was present; the cross-catalog differential executed."
      - name: Assert the engine-neutrality round trip actually ran
        run: |
          if grep -Eiq "pyiceberg is not available" data/pytest-output.txt; then
            echo "::error::precondition unproven — the pyiceberg round trip was SKIPPED."
            echo "pyiceberg is a runtime dependency (pyproject [project].dependencies);"
            echo "rebuild the image rather than accepting the skip."
            grep -Ein "pyiceberg is not available" data/pytest-output.txt || true
            exit 1
          fi
          echo "OK: pyiceberg was present; the cross-engine round trip executed."
      - name: Assert the real-catalog runs-table suite executed
        run: |
          if grep -Fq "AC1_REAL_CATALOG_SUITE_UNAVAILABLE" data/pytest-output.txt; then
            echo "::error::AC-1/FR-3 unproven — the real-catalog runs-table suite was skipped."
            grep -Fn "AC1_REAL_CATALOG_SUITE_UNAVAILABLE" data/pytest-output.txt || true
            exit 1
          fi
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.catalog_commits.test_queryable_observability --test-name test_real_terminal_runs_land_field_by_field_and_spark_reads_across_sources --minimum-passed 1
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.catalog_commits.test_runs_table_append_sink --minimum-passed 4
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.unit.observability.test_pyiceberg_declared_schema --minimum-passed 1
      - name: Assert the real-catalog contract preflight suite executed
        run: |
          if grep -Fq "PREFLIGHT_REAL_CATALOG_UNAVAILABLE" data/pytest-output.txt; then
            echo "::error::AC-5 unproven — the real-catalog preflight suite was skipped."
            grep -Fn "PREFLIGHT_REAL_CATALOG_UNAVAILABLE" data/pytest-output.txt || true
            exit 1
          fi
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.catalog_commits.test_contract_preflight_real_catalog --minimum-passed 10
      - name: Assert the contract enforcement suites executed
        run: |
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.contracts.test_pre_write_gate --minimum-passed 13
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.contracts.test_malformed_rows --minimum-passed 9
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.contracts.test_evolution_matrix --minimum-passed 59
      - name: Assert the contracts bronze differential executed
        run: |
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.contracts.test_bronze_unchanged_after_migration --minimum-passed 23
      - name: Assert the AC-2 seeded-query suite executed
        run: |
          if grep -Fq "AC2_SEEDED_QUERY_SUITE_UNAVAILABLE" data/pytest-output.txt; then
            echo "::error::AC-2 unproven — the published seeded-query suite was skipped."
            grep -Fn "AC2_SEEDED_QUERY_SUITE_UNAVAILABLE" data/pytest-output.txt || true
            exit 1
          fi
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.catalog_commits.test_queryable_observability --test-name test_published_ac2_queries_execute_verbatim_with_retry_and_window_boundaries --minimum-passed 1
      - name: Assert the cross-engine read-back executed
        run: |
          if grep -Fq "CROSS_ENGINE_READBACK_UNAVAILABLE" data/pytest-output.txt; then
            echo "::error::FR-3 unproven — Spark did not read back the PyIceberg commit."
            grep -Fn "CROSS_ENGINE_READBACK_UNAVAILABLE" data/pytest-output.txt || true
            exit 1
          fi
          docker compose -f docker/docker-compose.yml run --rm -T janus python -m tests.support.required_test_gate data/metadata/test-reports/ci.xml --class-name tests.integration.catalog_commits.test_pyiceberg_round_trip --test-name test_spark_reads_the_row_pyiceberg_committed --minimum-passed 1
      - name: Assert required orchestration Spark scenarios executed
        run: |
          docker compose -f docker/docker-compose.yml run --rm -T janus \
            python -m tests.support.required_test_gate \
              data/metadata/test-reports/ci.xml \
              --class-name tests.integration.orchestration.test_dependency_execution \
              --minimum-passed 8
      - name: Coverage summary (inside container)
        if: ${{ always() && hashFiles('data/.coverage') != '' }}
        run: |
          set -o pipefail
          JANUS_CONTAINER_USER="$(id -u):$(id -g)" \
          docker compose -f docker/docker-compose.yml run --rm -T \
            -e COVERAGE_FILE=data/.coverage \
            janus \
            python -m coverage report \
            | tee data/coverage-summary.txt
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: coverage
          path: |
            data/coverage.xml
            data/coverage-summary.txt
          if-no-files-found: warn
